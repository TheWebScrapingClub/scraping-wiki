name: Publish site

# Builds the wiki as a static site with Quartz and deploys it to GitHub Pages
# on every push (the daily pipeline pushes each morning).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the wiki
        uses: actions/checkout@v4
        with:
          path: wiki
      - name: Check out Quartz (pinned)
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v4.5.2
          path: quartz
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare content
        run: |
          python3 -m pip install --quiet pyyaml
          python3 wiki/.site/prepare_content.py wiki quartz/content
          cp wiki/.site/quartz.config.ts wiki/.site/quartz.layout.ts quartz/
      - name: Build
        working-directory: quartz
        run: |
          npm ci
          npx quartz build
      - name: Search tags (canonical, titles, descriptions, structured data)
        run: python3 wiki/.site/postprocess_html.py quartz/content quartz/public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
